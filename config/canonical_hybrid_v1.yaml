version: "1.0"

name: "Canonical Hybrid Relevance Engine"

description: >
  Combines normalized biological evidence and normalized semantic
  similarity for the current canonical literature pipeline.

components:
  biological:
    source: "phd_biological_score_v1"
    field: "biological_score"
    normalization: "min_max"
    weight: 0.60

  semantic:
    source: "pubmed_new_semantic_ranked"
    field: "semantic_similarity"
    normalization: "min_max"
    weight: 0.40

formula: "0.60 * biological_normalized + 0.40 * semantic_normalized"

categories:
  very_high:
    min_score: 0.75
    label: "Very High"

  high:
    min_score: 0.50
    label: "High"

  moderate:
    min_score: 0.25
    label: "Moderate"

  low:
    min_score: 0.00
    label: "Low"

canonical_model: "sentence-transformers/all-MiniLM-L6-v2"

status: "canonical_candidate"
