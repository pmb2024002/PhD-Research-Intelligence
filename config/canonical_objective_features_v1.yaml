version: "1.0"

name: "Canonical PhD Objective Evidence"

objectives:

  O1:
    id: "O1_conserved_signatures"
    name: "Conserved mitochondrial dysfunction signatures"
    description: >
      Evidence identifying conserved or reproducible mitochondrial
      dysfunction signatures across senescence models, datasets,
      or experimental conditions.
    terms:
      - conserved
      - conservation
      - consistent across
      - reproducible across
      - shared signature
      - common signature
      - cross-dataset
      - cross dataset
      - independent datasets
      - multiple datasets
      - multiple models
      - across models
      - meta-analysis
      - transcriptomic
      - transcriptomics
      - RNA-seq
      - gene expression
      - differential expression
      - proteomics
      - proteomic
      - mitochondrial dysfunction

  O2:
    id: "O2_multiomics_integration"
    name: "Transcriptomic-proteomic / multi-omics integration"
    description: >
      Evidence involving integration of two or more omics modalities
      or explicit multi-omics analysis.
    terms:
      - multi-omics
      - multiomics
      - transcriptomics
      - transcriptomic
      - RNA-seq
      - proteomics
      - proteomic
      - metabolomics
      - metabolomic
      - integrative analysis
      - cross-omics
      - integrated omics

  O3:
    id: "O3_hub_genes"
    name: "Mitochondrial hub genes"
    description: >
      Evidence involving the canonical PhD mitochondrial hub genes.
    source:
      canonical_vocabulary: "config/canonical_biological_vocabulary_v1.yaml"
      field: "primary_hub_genes"

  O4:
    id: "O4_conserved_pathways"
    name: "Conserved mitochondrial pathways"
    description: >
      Evidence involving canonical mitochondrial processes relevant
      to cellular senescence.
    source:
      canonical_vocabulary: "config/canonical_biological_vocabulary_v1.yaml"
      field: "core_mitochondrial_processes"

  O5:
    id: "O5_mechanistic_connection"
    name: "Mechanistic mitochondrial-senescence connection"
    description: >
      Evidence describing a mechanistic or causal relationship
      between mitochondrial dysfunction/processes and cellular senescence.
    terms:
      - mechanism
      - mechanistic
      - caused by
      - causes
      - induces
      - drives
      - driven by
      - mediates
      - mediated by
      - regulates
      - required for
      - necessary for
      - sufficient for
      - dependent on
      - mitochondrial dysfunction
      - mitochondrial dynamics
      - mitochondrial fission
      - mitochondrial fusion
      - mitophagy
      - mitochondrial quality control
      - mitochondrial biogenesis
      - mitochondrial ROS
      - cellular senescence
      - replicative senescence
      - irradiation-induced senescence
      - DNA damage-induced senescence
      - stress-induced senescence

status: "canonical_candidate"
